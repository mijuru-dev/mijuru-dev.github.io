title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Please check the product documentation first: https://mijuru-dev.github.io
        Please write in **English** — a machine translation is fine. Once you get a helpful reply, mark it as the answer.
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - mijuru.com
        - Browser extension (Mijuru Wallpapers)
        - Desktop app (Linux)
        - Mobile app (Android / iOS)
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Version and system (if relevant)
      placeholder: e.g. extension 1.4.0 on Chrome 131 / Ubuntu 24.04 GNOME / Android 14
