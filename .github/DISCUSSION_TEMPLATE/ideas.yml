title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea! Please write in **English** — a machine translation from your language is perfectly fine.
        Search first: if someone already suggested it, add a 👍 to their post — ideas with the most votes get planned first.
        Something is broken? Please [report a problem](https://github.com/mijuru-dev) in the product's repository instead.
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - mijuru.com
        - Browser extension (Mijuru Wallpapers)
        - Desktop app (Linux)
        - Mobile app (Android / iOS)
        - Several / all
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: The situation or problem behind the idea — this helps us find the best solution.
